<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: transparent;
  font-family: "M PLUS Rounded 1c", sans-serif;
  color: #425B9A;
}

.study-panel {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* =========================
   WEB / APPS
========================= */

.apps-box {
  width: 100%;
  padding: 24px;

  border-radius: 20px;

  background-image:
    url("https://i.pinimg.com/736x/cb/a2/f6/cba2f6cd30ff85fc5f61338d4327f35f.jpg");

  background-size: cover;
  background-position: center;
}

.box-title {
  margin: 0 0 18px;

  color: #425B9A;

  font-size: 21px;
  font-weight: 700;

  letter-spacing: 0.3px;
}

/* APP GRID */

.app-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 13px;
}

.app-card {
  padding: 13px;

  border-radius: 14px;

  background: rgba(255, 255, 255, 0.88);

  backdrop-filter: blur(3px);
}

.app-name,
.app-url {
  width: 100%;

  padding: 8px 9px;
  margin-bottom: 7px;

  border: 1px solid #d8e8f2;
  border-radius: 8px;

  outline: none;

  background: white;

  color: #425B9A;

  font-family: inherit;
  font-size: 13px;
}

.app-name {
  font-weight: 600;
}

.app-name:focus,
.app-url:focus {
  border-color: #76C0EC;
}

.app-name::placeholder,
.app-url::placeholder {
  color: #9aaac2;
}

.open-app {
  width: 100%;

  padding: 7px;

  border: none;
  border-radius: 8px;

  background: #76C0EC;

  color: white;

  font-family: inherit;
  font-size: 13px;
  font-weight: 600;

  cursor: pointer;

  transition: 0.2s;
}

.open-app:hover {
  opacity: 0.85;
  transform: translateY(-1px);
}


/* =========================
   GALLERY
========================= */

.gallery-box {
  width: 100%;

  padding: 24px;

  border-radius: 20px;

  background: white;
}

.gallery-grid {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 13px;
}

.photo-slot {
  position: relative;

  width: 100%;
  aspect-ratio: 1 / 1;

  overflow: hidden;

  border-radius: 14px;

  border: 1.5px dashed #76C0EC;

  background: #f4f8fb;

  cursor: pointer;
}

.photo-slot img {
  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;
}

.photo-placeholder {
  width: 100%;
  height: 100%;

  display: flex;

  align-items: center;
  justify-content: center;

  text-align: center;

  color: #7d98b4;

  font-size: 13px;
}

.photo-input {
  display: none;
}

.remove-photo {
  position: absolute;

  top: 7px;
  right: 7px;

  width: 25px;
  height: 25px;

  border: none;
  border-radius: 50%;

  background: rgba(255,255,255,0.9);

  color: #425B9A;

  cursor: pointer;

  font-family: inherit;

  z-index: 3;
}

.remove-photo:hover {
  background: white;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

  .apps-box,
  .gallery-box {
    padding: 17px;
  }

  .app-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="study-panel">

  <!-- ================= WEB / APPS ================= -->

  <div class="apps-box">

    <h2 class="box-title">
      WEB / APPS FOR STUDY
    </h2>

    <div class="app-grid">

      <div class="app-card">
        <input
          class="app-name"
          id="appName0"
          value="Website 01"
        >

        <input
          class="app-url"
          id="appUrl0"
          placeholder="https://..."
        >

        <button
          class="open-app"
          onclick="openApp(0)"
        >
          OPEN
        </button>
      </div>


      <div class="app-card">
        <input
          class="app-name"
          id="appName1"
          value="Website 02"
        >

        <input
          class="app-url"
          id="appUrl1"
          placeholder="https://..."
        >

        <button
          class="open-app"
          onclick="openApp(1)"
        >
          OPEN
        </button>
      </div>


      <div class="app-card">
        <input
          class="app-name"
          id="appName2"
          value="Website 03"
        >

        <input
          class="app-url"
          id="appUrl2"
          placeholder="https://..."
        >

        <button
          class="open-app"
          onclick="openApp(2)"
        >
          OPEN
        </button>
      </div>


      <div class="app-card">
        <input
          class="app-name"
          id="appName3"
          value="Website 04"
        >

        <input
          class="app-url"
          id="appUrl3"
          placeholder="https://..."
        >

        <button
          class="open-app"
          onclick="openApp(3)"
        >
          OPEN
        </button>
      </div>

    </div>

  </div>


  <!-- ================= GALLERY ================= -->

  <div class="gallery-box">

    <h2 class="box-title">
      GALLERY
    </h2>

    <div class="gallery-grid">

      <div
        class="photo-slot"
        onclick="choosePhoto(0)"
      >

        <input
          type="file"
          accept="image/*"
          class="photo-input"
          id="photoInput0"
          onchange="loadPhoto(0)"
        >

        <div
          id="photoContent0"
          class="photo-placeholder"
        >
          + Add photo
        </div>

        <button
          class="remove-photo"
          onclick="removePhoto(event, 0)"
        >
          ×
        </button>

      </div>


      <div
        class="photo-slot"
        onclick="choosePhoto(1)"
      >

        <input
          type="file"
          accept="image/*"
          class="photo-input"
          id="photoInput1"
          onchange="loadPhoto(1)"
        >

        <div
          id="photoContent1"
          class="photo-placeholder"
        >
          + Add photo
        </div>

        <button
          class="remove-photo"
          onclick="removePhoto(event, 1)"
        >
          ×
        </button>

      </div>

    </div>

  </div>

</div>


<script>

/* =========================
   STORAGE
========================= */

const STORAGE_KEY = "feverWebAppsGallery";

let data = JSON.parse(
  localStorage.getItem(STORAGE_KEY) || "null"
);

if (!data) {

  data = {
    apps: [
      {
        name: "Website 01",
        url: ""
      },
      {
        name: "Website 02",
        url: ""
      },
      {
        name: "Website 03",
        url: ""
      },
      {
        name: "Website 04",
        url: ""
      }
    ],

    photos: [
      "",
      ""
    ]
  };

  saveData();
}


/* =========================
   SAVE
========================= */

function saveData() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


/* =========================
   APP INPUTS
========================= */

for (let i = 0; i < 4; i++) {

  document
    .getElementById("appName" + i)
    .value = data.apps[i].name;

  document
    .getElementById("appUrl" + i)
    .value = data.apps[i].url;


  document
    .getElementById("appName" + i)
    .addEventListener(
      "input",
      function() {

        data.apps[i].name =
          this.value;

        saveData();

      }
    );


  document
    .getElementById("appUrl" + i)
    .addEventListener(
      "input",
      function() {

        data.apps[i].url =
          this.value;

        saveData();

      }
    );

}


/* =========================
   OPEN APP
========================= */

function openApp(index) {

  let url =
    data.apps[index].url.trim();

  if (!url) return;

  if (
    !url.startsWith("http://") &&
    !url.startsWith("https://")
  ) {
    url = "https://" + url;
  }

  window.open(url, "_blank");

}


/* =========================
   GALLERY
========================= */

function choosePhoto(index) {

  document
    .getElementById("photoInput" + index)
    .click();

}


function loadPhoto(index) {

  const input =
    document.getElementById(
      "photoInput" + index
    );

  const file = input.files[0];

  if (!file) return;

  const reader =
    new FileReader();

  reader.onload = function(event) {

    data.photos[index] =
      event.target.result;

    saveData();

    renderPhoto(index);

  };

  reader.readAsDataURL(file);

}


function renderPhoto(index) {

  const content =
    document.getElementById(
      "photoContent" + index
    );

  const photo =
    data.photos[index];

  if (!photo) {

    content.className =
      "photo-placeholder";

    content.innerHTML =
      "+ Add photo";

    return;
  }

  content.className = "";

  content.innerHTML = `
    <img
      src="${photo}"
      alt="Gallery image"
    >
  `;

}


function removePhoto(event, index) {

  event.stopPropagation();

  data.photos[index] = "";

  document
    .getElementById("photoInput" + index)
    .value = "";

  saveData();

  renderPhoto(index);

}


/* =========================
   LOAD PHOTOS
========================= */

renderPhoto(0);
renderPhoto(1);

</script>

</body>
</html>
